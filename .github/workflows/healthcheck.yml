name: healthcheck

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --retry 5 --retry-delay 30 --retry-all-errors --max-time 60 "https://finsight-api.onrender.com/healthz?db=1"
